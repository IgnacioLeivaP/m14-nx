# Magic 2014 para el instalador de este port: que archivos tuyos hacen falta, con que SHA256, y como se generan
# los menus a partir de tus WAD. Nada de esto es material del juego: los hashes solo comprueban que tu copia es la
# que el port espera, y las recetas de los menus son operaciones nuestras sobre datos que no salen de tu equipo.
#
# Un juego nuevo se anade con otro <id>.toml en esta carpeta; install.py y las herramientas no cambian.

schema = 1
id = "mtg14"
name = "Magic: The Gathering - Duels of the Planeswalkers 2014"
title_id = "584112C5"
nro = "mtg14.nro"
sd_folder = "mtg14-nx"
pack_name = "game_root"
sdk_min = "0.10.0"

# El generador de codigo (ReXGlue) y el perfil con el que se genero, para la linea [enhancements] del port.
codegen_manifest = "mtg14_manifest.toml"
codegen_profile = "optimised"
codegen_env = ["REX_MAX_JUMP_TABLE_ENTRIES=4096"]

# De donde salen los contenedores de shaders (tools/shaders_wad.py).
shader_wads = ["DATA_CORE.WAD", "UPDATE_DATA_CORE.WAD"]

