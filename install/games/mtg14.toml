# ---------------------------------------------------------------- menus (install/mtg14_lua.py)
#
# `entry` es la ruta dentro del WAD y `clase` la operacion de install/mtg14_lua.py. El sha256 es del fichero que
# produce el instalador; si tu copia da otro, se instala igual y se avisa (puede ser otra version del juego).

[[lua]]
module = "menus.frontend.main_menu"
out = "menus.frontend.main_menu.luac"
clase = "main_menu"
wad = "UPDATE_DATA_CORE.WAD"
entry = "UPDATE_DATA_CORE/DATA_ALL_PLATFORMS/LUBE/LOGIC/MENUS/FRONTEND/MAIN_MENU.LOB"
sha256 = "81a5fe1c1abfac9eb18e48bf7a813460897a22df6a276753652c0f01320695b5"
info = "quita del menu principal las filas de Xbox Live, logros y tienda, y el cartel de promociones"

